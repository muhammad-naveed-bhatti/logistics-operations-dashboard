name: quality-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall app.py auth_layer.py data_access.py rbac.py demo_data.py scripts
      - run: python scripts/check_migrations.py
      - run: python scripts/smoke_test.py
      - run: python scripts/app_smoke_test.py
